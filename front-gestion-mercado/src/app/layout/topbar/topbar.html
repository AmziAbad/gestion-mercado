<header class="topbar" style="display: flex; justify-content: flex-end; padding: 1rem 2rem; background: #fff; border-bottom: 1px solid #e5e7eb;">
  <div class="topbar__user" style="display: flex; align-items: center; gap: 1rem; text-align: right;">
    @if (user(); as currentUser) {
      <div>
        <span style="display: block; font-weight: bold; font-size: 0.9rem; color: #111827;">Lucía Pérez</span>
        <small style="display: block; font-size: 0.65rem; color: #6b7280; font-weight: bold;">ADMINISTRADOR</small>
      </div>
      <div style="width: 1px; height: 32px; background-color: #e5e7eb; margin: 0 0.5rem;"></div>
      <button style="background: transparent; border: none; cursor: pointer; color: #6b7280; display: flex; align-items: center; justify-content: center; padding: 0.5rem; border-radius: 50%; transition: all 0.2s;" onmouseover="this.style.backgroundColor='#fee2e2'; this.style.color='#ef4444';" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#6b7280';" title="Cerrar sesión" (click)="logout()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    }
  </div>
</header>
