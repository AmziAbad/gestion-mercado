@if (open) {
  <div class="modal-backdrop" (click)="closed.emit()"></div>
  <section class="modal" role="dialog" aria-modal="true" [attr.aria-label]="title">
    <header class="modal__header">
      <h2>{{ title }}</h2>
      <button type="button" (click)="closed.emit()" aria-label="Cerrar">x</button>
    </header>
    <div class="modal__body">
      <ng-content />
    </div>
  </section>
}
