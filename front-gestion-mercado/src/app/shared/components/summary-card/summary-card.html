<article class="summary-card">
  <div class="summary-card__content">
    <div class="summary-card__text">
      <span>{{ label }}</span>
      <strong>{{ value }}</strong>
      @if (helper) {
        <small>{{ helper }}</small>
      }
    </div>
    @if (icon) {
      <div class="summary-card__icon">
        <app-icon [name]="icon" [size]="24" />
      </div>
    }
  </div>
</article>
