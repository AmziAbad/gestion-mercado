<article class="summary-card">
  <div style="display: flex; justify-content: space-between; align-items: flex-start; z-index: 1;">
    <div style="display: flex; flex-direction: column; gap: 0.25rem;">
      <span>{{ label }}</span>
      <strong>{{ value }}</strong>
      @if (helper) {
        <small>{{ helper }}</small>
      }
    </div>
    @if (icon) {
      <div style="width: 48px; height: 48px; border-radius: 12px; background: rgba(59, 130, 246, 0.1); display: flex; align-items: center; justify-content: center; color: #3b82f6; font-size: 1.5rem;" [innerHTML]="icon">
      </div>
    }
  </div>
</article>
