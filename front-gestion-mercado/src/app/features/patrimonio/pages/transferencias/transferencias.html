<div class="page">
  <app-page-header
    title="Transferencias"
    subtitle="Traspaso de titularidad con validacion de deuda previa."
  >
    <button class="button button--primary" type="button" (click)="openCreateForm()">
      + Registrar transferencia
    </button>
  </app-page-header>

  @if (error()) {
    <div class="message message--error">{{ error() }}</div>
  }
  @if (message()) {
    <div class="message message--success">{{ message() }}</div>
  }

  <section class="panel">
    <div class="panel__header">
      <div>
        <h2 class="panel__title">Transferencias registradas</h2>
        <p class="panel__subtitle">
          {{ loading() ? 'Cargando...' : transferencias().length + ' registros' }}
        </p>
      </div>
    </div>
    <app-data-table [columns]="columns" [rows]="transferencias()" />
  </section>

  <app-modal [open]="showForm" title="Registrar transferencia" (closed)="closeForm()">
    <form class="modal-form" (ngSubmit)="registrar()">
      <label class="field">
        <span>ID puesto</span>
        <input name="idPuesto" type="number" [(ngModel)]="form.idPuesto" required />
      </label>

      <label class="field">
        <span>ID socio entrante</span>
        <input name="idSocioEntrante" type="number" [(ngModel)]="form.idSocioEntrante" required />
      </label>

      <label class="field">
        <span>Costo transferencia</span>
        <input
          name="costoTransferencia"
          type="number"
          min="0"
          step="0.01"
          [(ngModel)]="form.costoTransferencia"
        />
      </label>

      <label class="field">
        <span>Fecha inicio</span>
        <input name="fechaInicio" type="date" [(ngModel)]="form.fechaInicio" />
      </label>

      <label class="field">
        <span>Asume deuda</span>
        <select name="asumeDeuda" [(ngModel)]="form.asumeDeuda">
          <option [ngValue]="false">No</option>
          <option [ngValue]="true">Si</option>
        </select>
      </label>

      <label class="field modal-form__wide">
        <span>Observacion</span>
        <input name="observacion" [(ngModel)]="form.observacion" />
      </label>

      <div class="modal-actions">
        <button class="button button--secondary" type="button" (click)="closeForm()">
          Cancelar
        </button>
        <button class="button button--primary" type="submit">Registrar</button>
      </div>
    </form>
  </app-modal>
</div>
