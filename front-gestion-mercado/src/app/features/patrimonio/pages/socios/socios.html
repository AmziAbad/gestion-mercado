<div class="page">
  <app-page-header title="Socios" subtitle="Padron de titulares, comerciantes y asociacion.">
    <button class="button button--primary" type="button" (click)="openCreateForm()">
      + Registrar socio
    </button>
  </app-page-header>

  @if (error()) {
    <div class="message message--error">{{ formatError(error()) }}</div>
  }
  @if (message()) {
    <div class="message message--success">{{ message() }}</div>
  }

  <section class="panel">
    <div class="panel__header">
      <div>
        <h2 class="panel__title">Socios registrados</h2>
        <p class="panel__subtitle">
          {{ loading() ? 'Cargando...' : filteredSocios().length + ' registros' }}
        </p>
      </div>
      <div class="list-toolbar">
        <label class="search-field">
          <span class="search-field__icon">🔍</span>
          <input
            type="text"
            [ngModel]="searchTerm()"
            (ngModelChange)="searchTerm.set($event)"
            placeholder="Buscar por DNI o nombre..."
          />
        </label>
      </div>
    </div>

    <app-data-table
      [columns]="columns"
      [rows]="filteredSocios()"
      [actions]="actions"
      (actionSelected)="handleAction($event)"
    />
  </section>

  <app-modal
    [open]="showForm"
    [title]="editingId === null ? 'Registrar socio' : 'Editar socio'"
    (closed)="closeForm()"
  >
    <form novalidate class="modal-form" (ngSubmit)="save()">
      <label class="field">
        <span>DNI</span>
        <input name="dni" [(ngModel)]="form.dni" maxlength="8" required />
      </label>

      <label class="field">
        <span>RUC</span>
        <input name="ruc" [(ngModel)]="form.ruc" maxlength="11" />
      </label>

      <label class="field">
        <span>Nombres</span>
        <input name="nombres" [(ngModel)]="form.nombres" required />
      </label>

      <label class="field">
        <span>Apellidos</span>
        <input name="apellidos" [(ngModel)]="form.apellidos" required />
      </label>

      <label class="field">
        <span>Telefono</span>
        <input name="telefono" [(ngModel)]="form.telefono" />
      </label>

      <label class="field">
        <span>Correo</span>
        <input name="correo" type="email" [(ngModel)]="form.correo" />
      </label>

      <label class="field">
        <span>Estado</span>
        <select name="estado" [(ngModel)]="form.estado">
          <option value="ACTIVO">ACTIVO</option>
          <option value="INACTIVO">INACTIVO</option>
        </select>
      </label>

      <label class="field">
        <span>Asociacion</span>
        <select name="esAsociacion" [(ngModel)]="form.esAsociacion">
          <option [ngValue]="false">No</option>
          <option [ngValue]="true">Si</option>
        </select>
      </label>

      <label class="field modal-form__wide">
        <span>Direccion</span>
        <input name="direccion" [(ngModel)]="form.direccion" />
      </label>

      <div class="modal-actions">
        <button class="button button--secondary" type="button" (click)="closeForm()">
          Cancelar
        </button>
        <button class="button button--primary" type="submit">
          {{ editingId === null ? 'Registrar' : 'Guardar cambios' }}
        </button>
      </div>
    </form>
  </app-modal>
</div>
