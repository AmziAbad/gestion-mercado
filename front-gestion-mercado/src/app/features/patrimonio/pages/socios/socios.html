<div class="page">
  <app-page-header title="Socios" subtitle="Padron de titulares, comerciantes y asociacion." />

  @if (error()) {
    <div class="message message--error">{{ error() }}</div>
  }
  @if (message()) {
    <div class="message message--success">{{ message() }}</div>
  }

  <section class="panel">
    <div class="panel__header">
      <div>
        <h2 class="panel__title">{{ editingId === null ? 'Registrar socio' : 'Editar socio' }}</h2>
        <p class="panel__subtitle">Datos base para contratos y saneamiento de puestos.</p>
      </div>
    </div>
    <form class="panel__body form-grid" (ngSubmit)="save()">
      <label class="field">
        <span>DNI</span>
        <input name="dni" [(ngModel)]="form.dni" maxlength="8" required />
      </label>
      <label class="field">
        <span>RUC</span>
        <input name="ruc" [(ngModel)]="form.ruc" maxlength="11" />
      </label>
      <label class="field">
        <span>Nombres</span>
        <input name="nombres" [(ngModel)]="form.nombres" required />
      </label>
      <label class="field">
        <span>Apellidos</span>
        <input name="apellidos" [(ngModel)]="form.apellidos" required />
      </label>
      <label class="field">
        <span>Telefono</span>
        <input name="telefono" [(ngModel)]="form.telefono" />
      </label>
      <label class="field">
        <span>Correo</span>
        <input name="correo" type="email" [(ngModel)]="form.correo" />
      </label>
      <label class="field">
        <span>Estado</span>
        <select name="estado" [(ngModel)]="form.estado">
          <option value="ACTIVO">ACTIVO</option>
          <option value="INACTIVO">INACTIVO</option>
        </select>
      </label>
      <label class="field">
        <span>Asociacion</span>
        <select name="esAsociacion" [(ngModel)]="form.esAsociacion">
          <option [ngValue]="false">No</option>
          <option [ngValue]="true">Si</option>
        </select>
      </label>
      <label class="field form-grid__wide">
        <span>Direccion</span>
        <input name="direccion" [(ngModel)]="form.direccion" />
      </label>
      <div class="actions form-grid__actions">
        <button class="button button--primary" type="submit">
          {{ editingId === null ? 'Registrar' : 'Guardar cambios' }}
        </button>
        <button class="button button--secondary" type="button" (click)="reset()">Limpiar</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <div class="panel__header">
      <div>
        <h2 class="panel__title">Socios registrados</h2>
        <p class="panel__subtitle">
          {{ loading() ? 'Cargando...' : socios().length + ' registros' }}
        </p>
      </div>
    </div>
    <app-data-table
      [columns]="columns"
      [rows]="socios()"
      [actions]="actions"
      (actionSelected)="handleAction($event)"
    />
  </section>
</div>
