<div class="page">
  <app-page-header title="Caja" subtitle="Turnos de recaudacion y cierre diario." />

  @if (error()) {
    <div class="message message--error">{{ error() }}</div>
  }
  @if (message()) {
    <div class="message message--success">{{ message() }}</div>
  }

  <section class="grid grid--2">
    <form class="panel" (ngSubmit)="aperturar()">
      <div class="panel__header">
        <div>
          <h2 class="panel__title">Aperturar turno</h2>
          <p class="panel__subtitle">Solo debe existir un turno abierto por usuario.</p>
        </div>
      </div>
      <div class="panel__body form-grid form-grid--compact">
        <label class="field">
          <span>Monto inicial</span>
          <input
            name="montoInicial"
            type="number"
            min="0"
            step="0.01"
            [(ngModel)]="apertura.montoInicial"
          />
        </label>
        <label class="field caja-wide">
          <span>Observacion</span>
          <input name="observacionApertura" [(ngModel)]="apertura.observacionApertura" />
        </label>
        <div class="actions">
          <button class="button button--primary" type="submit">Aperturar</button>
        </div>
      </div>
    </form>

    <form class="panel" (ngSubmit)="cerrar()">
      <div class="panel__header">
        <div>
          <h2 class="panel__title">Cerrar turno</h2>
          <p class="panel__subtitle">El backend calcula recaudado, esperado y diferencia.</p>
        </div>
      </div>
      <div class="panel__body form-grid form-grid--compact">
        <label class="field">
          <span>ID turno</span>
          <input name="idTurnoCerrar" type="number" [(ngModel)]="cierre.idTurno" />
        </label>
        <label class="field caja-wide">
          <span>Observacion</span>
          <input name="observacionCierre" [(ngModel)]="cierre.observacionCierre" />
        </label>
        <div class="actions">
          <button class="button button--primary" type="submit">Cerrar</button>
        </div>
      </div>
    </form>
  </section>

  <section class="panel">
    <div class="panel__header">
      <div>
        <h2 class="panel__title">Turnos de caja</h2>
        <p class="panel__subtitle">
          {{ loading() ? 'Cargando...' : turnos().length + ' registros' }}
        </p>
      </div>
      <form class="actions" (ngSubmit)="load()" style="display: flex; align-items: flex-end; gap: 1rem; margin-top: 0.5rem;">
        <label class="field" style="margin: 0; padding: 0;">
          <span style="font-size: 0.85rem; margin-bottom: 0.25rem;">Fecha</span>
          <input name="fechaTurnos" type="date" [(ngModel)]="fecha" style="height: 40px; margin: 0; box-sizing: border-box;" />
        </label>
        <button class="button button--primary" type="submit" style="height: 40px; margin: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center;">Filtrar</button>
      </form>
    </div>
    <app-data-table [columns]="columns" [rows]="turnos()" />
  </section>
</div>
