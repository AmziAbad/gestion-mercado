<div class="page">
  <app-page-header title="Conceptos de cobro" subtitle="Items dinamicos para generar cuotas.">
    <button class="button button--primary" type="button" (click)="openCreateForm()">
      + Registrar concepto
    </button>
  </app-page-header>

  @if (error()) {
    <div class="message message--error">{{ error() }}</div>
  }
  @if (message()) {
    <div class="message message--success">{{ message() }}</div>
  }

  <section class="panel">
    <div class="panel__header">
      <div>
        <h2 class="panel__title">Conceptos registrados</h2>
        <p class="panel__subtitle">
          {{ loading() ? 'Cargando...' : conceptos().length + ' registros' }}
        </p>
      </div>
    </div>
    <app-data-table
      [columns]="columns"
      [rows]="conceptos()"
      [actions]="actions"
      (actionSelected)="handleAction($event)"
    />
  </section>

  <app-modal
    [open]="showForm"
    [title]="editingId === null ? 'Registrar concepto' : 'Editar concepto'"
    (closed)="closeForm()"
  >
    <form class="modal-form" (ngSubmit)="save()">
      <label class="field">
        <span>Nombre</span>
        <input name="nombreConcepto" [(ngModel)]="form.nombreConcepto" required />
      </label>

      <label class="field">
        <span>Tipo</span>
        <select name="tipoCobro" [(ngModel)]="form.tipoCobro">
          <option value="FIJO">FIJO</option>
          <option value="PRORRATEO">PRORRATEO</option>
        </select>
      </label>

      <label class="field">
        <span>Periodicidad</span>
        <select name="periodicidad" [(ngModel)]="form.periodicidad">
          <option value="MENSUAL">MENSUAL</option>
          <option value="DIARIO">DIARIO</option>
          <option value="EXTRAORDINARIO">EXTRAORDINARIO</option>
        </select>
      </label>

      <label class="field">
        <span>Activo</span>
        <select name="activo" [(ngModel)]="form.activo">
          <option [ngValue]="true">Si</option>
          <option [ngValue]="false">No</option>
        </select>
      </label>

      <label class="field">
        <span>Monto fijo</span>
        <input name="montoFijo" type="number" min="0" step="0.01" [(ngModel)]="form.montoFijo" />
      </label>

      <label class="field">
        <span>Total prorrateo</span>
        <input
          name="costoTotalProrrateo"
          type="number"
          min="0"
          step="0.01"
          [(ngModel)]="form.costoTotalProrrateo"
        />
      </label>

      <label class="field modal-form__wide">
        <span>Descripcion</span>
        <input name="descripcion" [(ngModel)]="form.descripcion" />
      </label>

      <div class="modal-actions">
        <button class="button button--secondary" type="button" (click)="closeForm()">
          Cancelar
        </button>
        <button class="button button--primary" type="submit">
          {{ editingId === null ? 'Registrar' : 'Guardar cambios' }}
        </button>
      </div>
    </form>
  </app-modal>
</div>
