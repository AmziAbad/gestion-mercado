<div class="page">
  <app-page-header title="Cuotas" subtitle="Generacion masiva o especifica de deudas." />

  @if (error()) {
    <div class="message message--error">{{ error() }}</div>
  }
  @if (message()) {
    <div class="message message--success">{{ message() }}</div>
  }

  <section class="grid grid--2">
    <form class="panel" (ngSubmit)="generarMasivas()">
      <div class="panel__header">
        <div>
          <h2 class="panel__title">Generar cuotas masivas</h2>
          <p class="panel__subtitle">Aplica a contratos activos y evita duplicados por periodo.</p>
        </div>
      </div>
      <div class="panel__body form-grid form-grid--compact">
        <label class="field">
          <span>ID concepto</span>
          <input name="masivaConcepto" type="number" [(ngModel)]="masiva.idConcepto" required />
        </label>
        <label class="field">
          <span>Mes</span>
          <input
            name="masivaMes"
            type="number"
            min="1"
            max="12"
            [(ngModel)]="masiva.periodoMes"
            required
          />
        </label>
        <label class="field">
          <span>Anio</span>
          <input
            name="masivaAnio"
            type="number"
            min="2020"
            [(ngModel)]="masiva.periodoAnio"
            required
          />
        </label>
        <label class="field">
          <span>Vencimiento</span>
          <input name="masivaVencimiento" type="date" [(ngModel)]="masiva.fechaVencimiento" />
        </label>
        <div class="actions">
          <button class="button button--primary" type="submit">Generar</button>
        </div>
      </div>
    </form>

    <form class="panel" (ngSubmit)="generarEspecifica()">
      <div class="panel__header">
        <div>
          <h2 class="panel__title">Generar cuota especifica</h2>
          <p class="panel__subtitle">Para un puesto o contrato puntual.</p>
        </div>
      </div>
      <div class="panel__body form-grid form-grid--compact">
        <label class="field">
          <span>ID puesto</span>
          <input name="espPuesto" type="number" [(ngModel)]="especifica.idPuesto" required />
        </label>
        <label class="field">
          <span>ID contrato</span>
          <input name="espContrato" type="number" [(ngModel)]="especifica.idContrato" />
        </label>
        <label class="field">
          <span>ID concepto</span>
          <input name="espConcepto" type="number" [(ngModel)]="especifica.idConcepto" required />
        </label>
        <label class="field">
          <span>Monto</span>
          <input
            name="espMonto"
            type="number"
            min="0.01"
            step="0.01"
            [(ngModel)]="especifica.montoTotal"
            required
          />
        </label>
        <label class="field">
          <span>Mes</span>
          <input name="espMes" type="number" min="1" max="12" [(ngModel)]="especifica.periodoMes" />
        </label>
        <label class="field">
          <span>Anio</span>
          <input name="espAnio" type="number" min="2020" [(ngModel)]="especifica.periodoAnio" />
        </label>
        <label class="field">
          <span>Vencimiento</span>
          <input name="espVencimiento" type="date" [(ngModel)]="especifica.fechaVencimiento" />
        </label>
        <div class="actions">
          <button class="button button--primary" type="submit">Generar</button>
        </div>
      </div>
    </form>
  </section>

  <section class="panel">
    <div class="panel__header">
      <div>
        <h2 class="panel__title">Cuotas generadas</h2>
        <p class="panel__subtitle">
          {{ loading() ? 'Cargando...' : cuotas().length + ' registros' }}
        </p>
      </div>
      <div class="cuota-actions">
        <label class="field">
          <span>Motivo anulacion/exoneracion</span>
          <input name="motivoOperacion" [(ngModel)]="motivoOperacion" />
        </label>
        <label class="field">
          <span>Reemplazo</span>
          <select name="generarReemplazo" [(ngModel)]="generarReemplazo">
            <option [ngValue]="false">No</option>
            <option [ngValue]="true">Si</option>
          </select>
        </label>
        <label class="field">
          <span>Monto reemplazo</span>
          <input
            name="montoReemplazo"
            type="number"
            min="0.01"
            step="0.01"
            [(ngModel)]="montoReemplazo"
          />
        </label>
      </div>
    </div>
    <app-data-table
      [columns]="columns"
      [rows]="cuotas()"
      [actions]="actions"
      (actionSelected)="handleAction($event)"
    />
  </section>
</div>
