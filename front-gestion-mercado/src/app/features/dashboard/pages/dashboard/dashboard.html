<div class="page">
  <app-page-header
    title="Panel general"
    subtitle="Vista operativa del saneamiento financiero y la gobernanza patrimonial."
  >
    <button class="button button--secondary" type="button" (click)="load()">Actualizar</button>
  </app-page-header>

  @if (error()) {
    <div class="message message--error">{{ error() }}</div>
  }

  <section class="dashboard-hero">
    <div>
      <h2>Bienvenido a Gestion Mercado</h2>
      <p>
        Monitorea las operaciones disponibles para tu rol dentro del saneamiento financiero y la
        gobernanza patrimonial.
      </p>
    </div>
    <div class="dashboard-hero__icon">
      <app-icon name="dashboard" [size]="48" />
    </div>
  </section>

  <section class="dashboard-grid">
    @for (metric of visibleMetrics(); track metric.key) {
      <app-summary-card
        [label]="metric.label"
        [value]="summary()[metric.key]"
        [helper]="metric.helper"
        [icon]="metric.icon"
      />
    }
  </section>
</div>
