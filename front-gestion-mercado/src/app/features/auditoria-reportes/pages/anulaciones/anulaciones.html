<div class="page">
  <app-page-header
    title="Anulaciones auditadas"
    subtitle="Sustento de cuotas, pagos, comprobantes o transferencias anuladas."
  />

  @if (error()) {
    <div class="message message--error">{{ error() }}</div>
  }
  @if (message()) {
    <div class="message message--success">{{ message() }}</div>
  }

  <section class="panel">
    <div class="panel__header">
      <div>
        <h2 class="panel__title">Registrar anulacion manual</h2>
        <p class="panel__subtitle">La operacion financiera debe ejecutarse desde Tesoreria.</p>
      </div>
    </div>
    <form class="panel__body form-grid" (ngSubmit)="registrar()">
      <label class="field">
        <span>Tipo</span>
        <select name="tipoAnulacion" [(ngModel)]="form.tipoAnulacion">
          <option value="CUOTA">CUOTA</option>
          <option value="PAGO">PAGO</option>
          <option value="COMPROBANTE">COMPROBANTE</option>
          <option value="TRANSFERENCIA">TRANSFERENCIA</option>
        </select>
      </label>
      <label class="field">
        <span>ID registro</span>
        <input
          name="idRegistroAfectado"
          type="number"
          [(ngModel)]="form.idRegistroAfectado"
          required
        />
      </label>
      <label class="field">
        <span>ID usuario</span>
        <input name="idUsuarioAnulacion" type="number" [(ngModel)]="form.idUsuario" required />
      </label>
      <label class="field anulacion-motivo">
        <span>Motivo</span>
        <input name="motivoSustento" [(ngModel)]="form.motivoSustento" required />
      </label>
      <div class="actions">
        <button class="button button--primary" type="submit">Registrar</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <div class="panel__header">
      <div>
        <h2 class="panel__title">Historial de anulaciones</h2>
        <p class="panel__subtitle">
          {{ loading() ? 'Cargando...' : anulaciones().length + ' registros' }}
        </p>
      </div>
    </div>
    <app-data-table [columns]="columns" [rows]="anulaciones()" />
  </section>
</div>
