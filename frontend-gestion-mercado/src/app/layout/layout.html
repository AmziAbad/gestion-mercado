<div class="shell">
  <aside class="sidebar" aria-label="Menu principal">
    <h2 class="sidebar-title">Panel Admin</h2>
    <hr />

    <nav class="nav-list">
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Dashboard</a
      >
      <a routerLink="/socios" routerLinkActive="active">Gestion de Socios</a>
      <a routerLink="/puestos" routerLinkActive="active">Inventario de Puestos</a>
      <a routerLink="/transferencias" routerLinkActive="active">Traspasos</a>
      <a routerLink="/servicios" routerLinkActive="active">Servicios</a>
      <a routerLink="/cobranzas" routerLinkActive="active">Pagos</a>
      <a routerLink="/reportes" routerLinkActive="active">Reportes</a>
      <a routerLink="/usuarios" routerLinkActive="active">Usuarios</a>
    </nav>

    <hr />
    <button class="logout-link" type="button" (click)="logout()">Cerrar Sesion</button>
  </aside>

  <main class="workspace">
    <section class="content">
      <router-outlet />
    </section>
  </main>
</div>
