spring.application.name=api-gateway
server.port=8089
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webmvc.routes[0].id=api-Servicio-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8092
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api-Servicio-service/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[1].id=api-Puesto-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8093
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api-Puesto-service/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1
