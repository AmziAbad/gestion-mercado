spring.application.name=api-gateway
server.port=8089
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webmvc.routes[0].id=api-UsuarioLogin-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http//localhost:8090
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api-UsuarioLogin-service/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

