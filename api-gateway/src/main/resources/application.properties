spring.application.name=api-gateway
server.port=8089
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.config.import=configserver:http://localhost:8888

spring.cloud.gateway.server.webmvc.routes[0].id=api-auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8100
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api-auth-service/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[1].id=api-patrimonio-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8101
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api-patrimonio-service/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[2].id=api-tesoreria-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8102
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api-tesoreria-service/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[3].id=api-auditoria-reportes-service
spring.cloud.gateway.server.webmvc.routes[3].uri=http://localhost:8103
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api-auditoria-reportes-service/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=1
